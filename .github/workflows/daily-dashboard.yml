name: Solar dashboard

# The workbook is uploaded by hand on working days, so there is no fixed time to
# schedule against - the push trigger below is what matters, and it fires the
# moment the upload lands. The daily cron only refreshes irradiance (recent days
# start as forecast and firm up to reanalysis a few days later) and covers a run
# that failed; it is not how new workbooks are noticed.
on:
  push:
    branches: [main]
    paths:
      - "Generation/**"
      - "scripts/**"
      - "config/**"
  schedule:
    - cron: "0 4 * * *"    # 09:30 IST - irradiance refresh and failed-run cover
  workflow_dispatch:

permissions:
  contents: write   # committing the rebuilt dataset and dashboard
  pages: write      # publishing the dashboard to GitHub Pages
  id-token: write   # the Pages deploy uses OIDC

concurrency:
  # A bulk backfill pushes many commits in a row. Each rebuilds the whole
  # dataset, so an in-flight run superseded by a newer push is redundant work -
  # cancel it and let the newest win. The schedule is the backstop if the last
  # run of a burst is itself cancelled.
  group: daily-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/daily_update.py

      - name: Commit refreshed data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Power Automate can push a workbook while this run is in flight, which
          # rejects our push. Rather than rebase (the built HTML would conflict
          # with itself), reset onto the new head and regenerate: the pipeline is
          # deterministic and merges into the existing dataset, so rebuilding from
          # the newer base always gives the right answer.
          for attempt in 1 2 3; do
            # Generation/ belongs to Power Automate - only derived output is committed
            git add -A data dashboard
            if git diff --staged --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            git commit -m "Daily solar update: $(date -u '+%Y-%m-%d')"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected - remote moved. Rebuilding on the new head."
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python scripts/daily_update.py
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Package the dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  # Publishes dashboard/index.html at the repository's Pages URL, so the link is
  # current as soon as a run finishes - no schedule to guess an upload time.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
